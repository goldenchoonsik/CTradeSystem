[pytest]
pythonpath = . CTrade CCommander shared CAiModelBaker
testpaths = shared/tests CTrade/tests CCommander/tests CAiModelBaker/tests tests
norecursedirs = .git .venv CAiModelBaker/.venv CTrade/.venv scratch CTrade/scratch vultr_logs data
python_files = test_*.py *_test.py
filterwarnings =
    ignore::DeprecationWarning
markers =
    real_vault: 실제 DataVault 를 읽는 실물 검사(래칫·데이터 감사) — 코드가 아니라 데이터 상태를 본다. 수집 후에 돌린다.
